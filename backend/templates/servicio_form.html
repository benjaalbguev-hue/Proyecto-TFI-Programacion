<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Servicio Técnico - Nuevo Servicio</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Tom Select -->

    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='css/servicio_form.css') }}">

</head>

<body>

<div class="container">

    <!-- ========================= -->
    <!-- SIDEBAR -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-computer"></i>

            <h2>Servicio<br>Técnico</h2>

        </div>

        <nav>

            <ul>

                <li>

                    <a href="/">

                        <i class="fa-solid fa-users"></i>

                        <span>Clientes</span>

                    </a>

                </li>

                <li>

                    <a href="/equipos/nuevo">

                        <i class="fa-solid fa-laptop"></i>

                        <span>Equipos</span>

                    </a>

                </li>

                <li class="active">

                    <a href="#">

                        <i class="fa-solid fa-screwdriver-wrench"></i>

                        <span>Servicios</span>

                    </a>

                </li>

                <li>

                    <a href="#">

                        <i class="fa-solid fa-user-gear"></i>

                        <span>Usuarios</span>

                    </a>

                </li>

                <li>

                    <a href="#">

                        <i class="fa-solid fa-chart-column"></i>

                        <span>Reportes</span>

                    </a>

                </li>

            </ul>

        </nav>

    </aside>

    <!-- ========================= -->
    <!-- CONTENIDO -->
    <!-- ========================= -->

    <main class="content">

        <div class="form-card">

            <div class="form-header">

                <h1>Nuevo Servicio Técnico</h1>

                <p>Inicio / <strong>Servicios</strong> / Nuevo</p>

            </div>

            <form id="formServicio">

                <!-- ========================= -->
                <!-- CLIENTE -->
                <!-- ========================= -->

                <h3 class="section-title">

                    Datos del Cliente

                </h3>

                <div class="form-group">

                    <label>Cliente <span>*</span></label>

                    <select id="cliente">

                    </select>

                    <a href="/clientes/nuevo" class="nuevo-link">

                        + Nuevo Cliente

                    </a>

                </div>

                <!-- ========================= -->
                <!-- EQUIPO -->
                <!-- ========================= -->

                <h3 class="section-title">

                    Datos del Equipo

                </h3>

                <div class="form-group">

                    <label>Equipo <span>*</span></label>

                    <select id="equipo">

                    </select>

                    <a href="/equipos/nuevo" class="nuevo-link">

                        + Nuevo Equipo

                    </a>

                </div>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Tipo</label>

                        <input
                            type="text"
                            id="tipoEquipo"
                            readonly>

                    </div>

                    <div class="form-group">

                        <label>Marca</label>

                        <input
                            type="text"
                            id="marca"
                            readonly>

                    </div>

                    <div class="form-group">

                        <label>Modelo</label>

                        <input
                            type="text"
                            id="modelo"
                            readonly>

                    </div>

                    <div class="form-group">

                        <label>Número de Serie</label>

                        <input
                            type="text"
                            id="numeroSerie"
                            readonly>

                    </div>

                </div>

                <!-- ========================= -->
                <!-- SERVICIO -->
                <!-- ========================= -->

                <h3 class="section-title">

                    Datos del Servicio

                </h3>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Fecha de ingreso</label>

                        <input
                            type="date"
                            id="fechaIngreso"
                            readonly>

                    </div>

                    <div class="form-group">

                        <label>Estado <span>*</span></label>

                        <select id="estado">

                        </select>

                    </div>

                </div>

                <div class="form-group">

                    <label>Problema Reportado <span>*</span></label>

                    <textarea
                        id="problema"
                        rows="4"
                        required></textarea>

                </div>

                <div class="form-group">

                    <label>Diagnóstico</label>

                    <textarea
                        id="diagnostico"
                        rows="4"></textarea>

                </div>

                <div class="form-group">

                    <label>Solución</label>

                    <textarea
                        id="solucion"
                        rows="4"></textarea>

                </div>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Total</label>

                        <input
                            type="number"
                            id="total"
                            value="0">

                    </div>

                    <div class="form-group">

                        <label>Fecha de Entrega</label>

                        <input
                            type="date"
                            id="fechaEntrega">

                    </div>

                </div>

                <div class="form-buttons">

                    <button
                        type="button"
                        class="btn-cancel"
                        onclick="window.location.href='/'">

                        Cancelar

                    </button>

                    <button
                        type="submit"
                        class="btn-save">

                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>

<script src="{{ url_for('static', filename='js/servicio_form.js') }}"></script>

</body>

</html>
